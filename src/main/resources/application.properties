spring.application.name=sistem-informasi-perpustakaan

# Konfigurasi Database MySQL & Hibernate (Nilai Plus ORM)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_spring_ai?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Konfigurasi Spring AI Ollama lokal
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}
spring.ai.ollama.chat.options.temperature=0.7
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.chat.client.ChatClientAutoConfiguration