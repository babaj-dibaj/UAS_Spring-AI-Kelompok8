<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perpustakaan Digital</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#38251f;background:#f4eee8;--maroon:#6f263d;--maroon-dark:#4b1829;--cocoa:#9a6b55;--cream:#fffaf5;--line:#eadbd1;--shadow:0 20px 55px rgba(89,48,36,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0%,#ead8d0 0,transparent 30%),#f4eee8}.app{width:min(1180px,94vw);margin:34px auto;background:var(--cream);border:1px solid #eadbd1;border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.top{position:relative;background:linear-gradient(125deg,var(--maroon-dark),var(--maroon));color:#fff;padding:38px 42px}.top:after{content:"";position:absolute;right:7%;top:20px;width:150px;height:150px;border:1px solid rgba(255,255,255,.16);border-radius:50%;box-shadow:0 0 0 18px rgba(255,255,255,.04),0 0 0 38px rgba(255,255,255,.03)}.top h1{position:relative;z-index:1;margin:0 0 8px;font-family:Georgia,serif;font-size:clamp(28px,4vw,43px);letter-spacing:-.7px}.top p{position:relative;z-index:1;margin:0;max-width:620px;color:#f1dcd5;line-height:1.6}.nav{display:flex;gap:7px;padding:15px 28px;border-bottom:1px solid var(--line);background:#fffaf5;flex-wrap:wrap}.nav button,.primary{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font:inherit;font-weight:700;transition:.2s}.nav button{background:transparent;color:#805c4d}.nav button:hover{background:#f2e5df}.nav button.active,.primary{background:var(--maroon);color:#fff}.primary:hover{background:#8c304c;transform:translateY(-1px)}.content{padding:30px 34px 40px}.panel{display:none}.panel.active{display:block}.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.toolbar input,.toolbar textarea,.toolbar select,.ai input,.ai select,.ai textarea{padding:12px 13px;border:1px solid #dec9be;border-radius:10px;background:#fffdfb;color:inherit;font:inherit}.toolbar input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:17px}.card{border:1px solid var(--line);border-radius:15px;padding:19px;background:#fffdfb;box-shadow:0 5px 15px rgba(89,48,36,.04)}.card h3{margin:0 0 6px;color:var(--maroon-dark);font-family:Georgia,serif;font-size:21px}.muted{color:#8e7164;font-size:13px}.stock{color:#57745b;font-weight:700}.ai{background:#f2e5df;border:1px solid #e2cfc5;border-radius:15px;padding:20px;margin-top:18px}.ai form{display:grid;gap:10px}.ai textarea{width:100%;min-height:90px;margin:8px 0;resize:vertical}.answer{white-space:pre-wrap;line-height:1.65;background:#fffdfb;padding:15px;border-radius:10px;margin-top:14px;border-left:4px solid var(--cocoa)}.table{width:100%;border-collapse:collapse;background:#fffdfb;border:1px solid var(--line);border-radius:12px;overflow:hidden}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:14px}.table th{color:var(--maroon-dark);background:#f2e5df}@media(max-width:650px){.app{width:100%;margin:0;border-radius:0}.top{padding:30px 22px}.content{padding:22px 16px}.table{display:block;overflow:auto}}
</style></head>
<body><div class="app"><header class="top"><h1>Sistem Informasi Perpustakaan</h1><p>Kelola buku, mahasiswa, peminjaman, dan gunakan AI sebagai pustakawan digital.</p></header>
<nav class="nav"><button class="active" data-tab="books">Katalog Buku</button><button data-tab="students">Mahasiswa</button><button data-tab="loans">Peminjaman</button><button data-tab="ai">AI Perpustakaan</button></nav>
<main class="content">
<section id="books" class="panel active"><div class="toolbar"><input id="search" placeholder="Cari judul, penulis, atau kategori..."><button class="primary" onclick="showAddBook()">+ Tambah Buku</button></div><div id="bookList" class="grid"></div><div id="bookForm"></div></section>
<section id="students" class="panel"><div class="toolbar"><button class="primary" onclick="showAddStudent()">+ Tambah Mahasiswa</button></div><div id="studentList" class="grid"></div><div id="studentForm"></div></section>
<section id="loans" class="panel"><div class="toolbar"><button class="primary" onclick="showLoan()">+ Catat Peminjaman</button></div><div id="loanList"></div><div id="loanForm"></div></section>
<section id="ai" class="panel"><h2>AI Pustakawan</h2><p class="muted">Tanyakan rekomendasi buku berdasarkan kebutuhanmu atau buat ringkasan sinopsis.</p><div class="ai"><b>Rekomendasi buku cerdas</b><span class="muted"> · berjalan lokal dengan Ollama</span><textarea id="aiRequest" placeholder="Contoh: Saya ingin belajar database dari dasar"></textarea><button class="primary" onclick="recommend()">Tanya AI</button><div id="aiAnswer" class="answer" hidden></div></div></section>
</main></div>
<script>
const $=id=>document.getElementById(id);async function api(url,opt){let r=await fetch(url,opt),text=await r.text(),d={};try{d=text?JSON.parse(text):{}}catch(_){d={}}if(!r.ok)throw Error(d.error||`Request gagal (${r.status})`);return d}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='books')loadBooks();if(b.dataset.tab==='students')loadStudents();if(b.dataset.tab==='loans')loadLoans()});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function loadBooks(){let q=$('search').value,bs=await api('/api/books'+(q?'?q='+encodeURIComponent(q):''));$('bookList').innerHTML=bs.map(b=>`<article class=card><h3>${esc(b.title)}</h3><div>${esc(b.author)}</div><p class=muted>${esc(b.category)} · ISBN ${esc(b.isbn)}</p><p>${esc(b.synopsis)}</p><span class=stock>${b.availableStock}/${b.totalStock} tersedia</span><br><button onclick="summary(${b.id})">Ringkas dengan AI</button></article>`).join('')||'<p>Buku belum tersedia.</p>'}
function showAddBook(){$('bookForm').innerHTML=`<div class=ai><h3>Tambah Buku</h3><form onsubmit="addBook(event)"><input name=title placeholder=Judul required><input name=author placeholder=Penulis required><input name=category placeholder=Kategori required><input name=isbn placeholder=ISBN required><input name=totalStock type=number min=0 placeholder=Stok required><textarea name=synopsis placeholder=Sinopsis required></textarea><button class=primary>Simpan</button></form></div>`}
async function addBook(e){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);o.totalStock=+o.totalStock;try{await api('/api/books',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});$('bookForm').innerHTML='';loadBooks()}catch(x){alert(x.message)}}
async function loadStudents(){let ss=await api('/api/students');$('studentList').innerHTML=ss.map(s=>`<article class=card><h3>${esc(s.name)}</h3><p>${esc(s.studentNumber)}</p><span class=muted>${esc(s.studyProgram)}</span></article>`).join('')}
function showAddStudent(){$('studentForm').innerHTML=`<div class=ai><form onsubmit="addStudent(event)"><input name=name placeholder=Nama required><input name=studentNumber placeholder=NIM required><input name=studyProgram placeholder=Program studi required><button class=primary>Simpan</button></form></div>`}
async function addStudent(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));try{await api('/api/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});$('studentForm').innerHTML='';loadStudents()}catch(x){alert(x.message)}}
async function loadLoans(){let ls=await api('/api/loans');$('loanList').innerHTML=`<table class=table><tr><th>Buku</th><th>Mahasiswa</th><th>Jatuh tempo</th><th>Status</th><th>Aksi</th></tr>${ls.map(l=>`<tr><td>${esc(l.bookTitle)}</td><td>${esc(l.studentName)}</td><td>${l.dueDate}</td><td>${l.status}</td><td>${l.status==='BORROWED'?`<button onclick="returnBook(${l.id})">Kembalikan</button>`:'-'}</td></tr>`).join('')}</table>`}
async function showLoan(){let [bs,ss]=await Promise.all([api('/api/books'),api('/api/students')]);$('loanForm').innerHTML=`<div class=ai><form onsubmit="borrow(event)"><select name=bookId>${bs.filter(b=>b.availableStock>0).map(b=>`<option value=${b.id}>${esc(b.title)}</option>`).join('')}</select><select name=studentId>${ss.map(s=>`<option value=${s.id}>${esc(s.name)}</option>`).join('')}</select><input name=dueDate type=date required><button class=primary>Simpan</button></form></div>`}
async function borrow(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.bookId=+o.bookId;o.studentId=+o.studentId;try{await api('/api/loans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});$('loanForm').innerHTML='';loadLoans()}catch(x){alert(x.message)}}
async function returnBook(id){try{await api('/api/loans/'+id+'/return',{method:'POST'});loadLoans()}catch(x){alert(x.message)}}
async function recommend(){let a=$('aiAnswer');a.hidden=false;a.textContent='AI sedang berpikir...';try{a.textContent=(await api('/api/ai/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:$('aiRequest').value})})).answer}catch(x){a.textContent=x.message}}
async function summary(id){document.querySelector('[data-tab=ai]').click();let a=$('aiAnswer');a.hidden=false;a.textContent='AI sedang meringkas...';try{a.textContent=(await api('/api/ai/books/'+id+'/summary',{method:'POST'})).answer}catch(x){a.textContent=x.message}}
$('search').oninput=loadBooks;loadBooks();
</script></body></html>
